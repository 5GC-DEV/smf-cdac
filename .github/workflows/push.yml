on:
    workflow_dispatch:
    
jobs:
  docker-build-push-images:
    runs-on: ubuntu-latest
   
    env:
      REGISTRY: ghcr.io
      DOCKER_REGISTRY: ghcr.io/
      DOCKER_REPOSITORY: ios-mcn-core/
      RELEASE_VERSION: 0.0.3
       
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - run: echo GIT_SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_ENV

      - uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCRUSER }}
          password: ${{ secrets.GHCRPASS }}

      - name: Build and push "main-latest" Docker image
        env:
          DOCKER_TAG: iosmcn-smf-release-${{ env.RELEASE_VERSION }}
        run: |
          make docker-build
          make docker-push

      - name: Build and push "main-GIT_SHA" Docker image
        env:
          DOCKER_TAG: iosmcn-smf-release-${{ env.RELEASE_VERSION }}
        run: |
          make docker-build
          make docker-push

  # CAUTION: Other actions depend on this name "tag-github"
  tag-github:
    uses: omec-project/.github/.github/workflows/tag-github.yml@main
    secrets: inherit

  release-image:
    needs: tag-github
    uses: omec-project/.github/.github/workflows/release-image.yml@main
    with:
      changed: ${{ needs.tag-github.outputs.changed }}
      version: ${{ needs.tag-github.outputs.version }}
    secrets: inherit

  update-version:
    needs: tag-github
    uses: omec-project/.github/.github/workflows/update-version.yml@main
    with:
      changed: ${{ needs.tag-github.outputs.changed }}
      version: ${{ needs.tag-github.outputs.version }}
    secrets: inherit

  branch-release:
    needs: tag-github
    uses: omec-project/.github/.github/workflows/branch-release.yml@main
    with:
      release_branch: ${{ needs.tag-github.outputs.release_branch }}
      version_branch: ${{ needs.tag-github.outputs.version_branch }}
    secrets: inherit
